[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "setlhare"
version = "1.0.0"
description = "Offline terminal pair programmer — stack trace in, fix out, no internet."
readme = "README.md"
license = "GPL-3.0-only"
requires-python = ">=3.9"
authors = [{ name = "Nyakallo Masiu", email = "nyakallomasiu@gmail.com" }]
keywords = ["offline", "llm", "coding", "debugging", "terminal", "llama.cpp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Debuggers",
]

[project.scripts]
setlhare = "cli:main"

[project.urls]
Repository = "https://github.com/nyaks1/setlhare"

[tool.setuptools.packages.find]
include = ["setlhare*"]
